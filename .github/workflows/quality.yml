name: Deterministic product gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: klnk_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: klnk_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klnk_test -d klnk_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      LEGACY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm test
      - run: npm run test:components
      - run: npm run test:pg
        env:
          KLNK_TEST_POSTGRES_URL: postgresql://klnk_test:disposable-ci-only@127.0.0.1:5432/klnk_qa
      - run: npm run build:server
      - run: npm run test:compiled
        env:
          KLNK_TEST_POSTGRES_URL: postgresql://klnk_test:disposable-ci-only@127.0.0.1:5432/klnk_qa
      - run: npm run demo
      - run: npm audit --audit-level=high
      - run: npm run e2e:build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-verification
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            docs/review/2026-10-28/evidence/
            docs/agent-network/evidence/
    # No provider secrets, service accounts, deployment or paid smoke in this job.
